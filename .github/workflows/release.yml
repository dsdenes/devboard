# The Release Train builds through `devboard-build.yml`. This workflow stays as
# the manual entry point the harness names, and it never builds or publishes a
# version: the canonical build path is `devboard-build.yml`, dispatched by
# `devboard publish` at the temporary build ref.
name: Release
permissions:
  "contents": "write"
on:
  workflow_dispatch:

jobs:
  retired:
    runs-on: "ubuntu-22.04"
    steps:
      - name: Explain the release path
        run: |
          echo "The Release Train publishes through devboard-build.yml; this workflow builds nothing."
