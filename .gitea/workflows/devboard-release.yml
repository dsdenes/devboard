name: devboard-release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: host
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install harness dependencies
        working-directory: .devboard
        run: bun install --frozen-lockfile
      - name: Build the client bundle
        working-directory: .devboard
        run: bun run build
      - name: Run the harness suite
        working-directory: .devboard
        run: bun test
      - name: Typecheck
        working-directory: .devboard
        run: bunx tsc --noEmit
      - name: Check the client
        working-directory: .devboard
        run: bun run check
      - name: Publish the harness release and launcher
        working-directory: .devboard
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DEVBOARD_GITEA_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          DEVBOARD_GITEA_URL: ${{ vars.DEVBOARD_URL }}
        run: bun run release
