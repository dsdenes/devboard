# Harness model policy, installed as <host>/.omp/config.yml.
#
# Every omp process the harness starts works from the host repository, so this
# project-local settings file applies to the interactive agent and to each ACP
# peer (`omp acp`) it spawns. All chat roles use DeepSeek V4.1 Flash through
# OpenCode Go; the free OpenCode Zen variant is not used.
modelRoles:
  default: opencode-go/deepseek-v4.1-flash
  plan: opencode-go/deepseek-v4.1-flash
  smol: opencode-go/deepseek-v4.1-flash
  slow: opencode-go/deepseek-v4.1-flash
  task: opencode-go/deepseek-v4.1-flash
