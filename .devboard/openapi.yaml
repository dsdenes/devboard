components:
  responses:
    Problem:
      description: "RFC 9457 Problem JSON."
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
    OperationBody:
      type: object
      description: "The operation-specific payload; snake_case fields are accepted."
      additionalProperties: true
    Frames:
      type: object
      required: [frames]
      properties:
        frames:
          type: array
          items: {type: object, additionalProperties: true}
        self: {type: string, format: uri}
        next: {type: [string, "null"], format: uri}
        prev: {type: [string, "null"], format: uri}
    Ready:
      type: object
      required: [pid]
      properties:
        pid: {type: integer}
    Report:
      type: object
      required: [id, title, status, delivery_timeout_ms, links]
      properties:
        id: {type: integer}
        title: {type: string}
        status: {type: string, enum: [FILING, FILED, FAILED]}
        detail: {type: string}
        delivery_timeout_ms: {type: integer}
        links:
          type: object
          properties:
            report:
              type: object
              properties:
                href: {type: string, format: uri}
            issue:
              type: object
              properties:
                href: {type: string, format: uri}
    GoalProposal:
      type: object
      additionalProperties: true
    Run:
      type: object
      required: [id, kind, label, lifecycle, live, output]
      properties:
        id: {type: string}
        kind: {type: string}
        label: {type: string}
        lifecycle: {type: string}
        live: {type: boolean}
        updated_at: {type: [string, "null"]}
        self: {type: string, format: uri}
        output:
          type: string
          format: uri
          description: "Absolute link to this run's output endpoint."
    RunCollection:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items: {$ref: "#/components/schemas/Run"}
        self: {type: string, format: uri}
