openapi: "3.1.0"
info:
  title: "Devboard Dashboard API"
  version: "1.0.0"
  description: >-
    The dashboard's resource-oriented HTTP API. The browser reads every resource
    and performs every action over these root paths; the only WebSocket is a live
    ACP run's own output endpoint. The API is loopback-only, presents no
    credential, and refuses an unserved Host and a cross-origin request.
  contact:
    name: "Devboard maintainers"
    url: "https://github.com/dsdenes/devboard"
  x-api-id: "devboard.dashboard"
  x-audience: "local operator of this dashboard"
  x-access-model: "loopback-only; no credential; Host and Origin guards on every route"
servers:
  - url: "/"
security: []
tags:
  - name: Workspace
  - name: Issues
  - name: Agents
  - name: Goal
  - name: Flow
  - name: Discover
  - name: Inquiries
  - name: Providers
  - name: Runs
  - name: Operations
paths:
  /agents:
    get:
      operationId: "getAgents"
      tags: ["Agents"]
      responses:
        "200":
          description: "The operation result."
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Frames"}
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "405":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "304":
          description: "The representation is unchanged."
          headers:
            ETag: {schema: {type: string}}
      x-cache: "no-cache; ETag validation"
  /agents/{id}:
