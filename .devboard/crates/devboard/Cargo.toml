[package]
name = "devboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/dsdenes/devboard"
description = "The Devboard dashboard: browser interface, flows, workers, and install paths"

[lib]
name = "devboard"
path = "src/lib.rs"

[[bin]]
name = "devboard"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
flate2.workspace = true
xz2.workspace = true
futures-util.workspace = true
hex.workspace = true
http-body-util.workspace = true
include_dir.workspace = true
libc.workspace = true
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tar.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
uuid.workspace = true
url.workspace = true
time.workspace = true

[dev-dependencies]
flate2.workspace = true
hex.workspace = true
serde_yaml = "0.9"
sha2.workspace = true
tar.workspace = true
xz2.workspace = true
# `start_paused` gives the reply-budget tests a deterministic clock.
tokio = { workspace = true, features = ["test-util"] }
