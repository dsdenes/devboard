<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Draft goals body — wireframe (empty)</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        background: #f4f4f4;
        color: #222;
        font-family: ui-sans-serif, system-ui, sans-serif;
        margin: 0;
        padding: 24px;
      }
      .shell { max-width: 1100px; margin: 0 auto; }
      .region { background: #fff; border: 1px solid #c9c9c9; border-radius: 3px; padding: 12px; }
      .note { color: #6b6b6b; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; }
      header.region { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
      h1 { font-size: 20px; margin: 0; }
      .identity { color: #555; font-family: ui-monospace, monospace; font-size: 12px; }
      main { display: grid; grid-template-columns: minmax(0, 1fr); }
      .panel { display: flex; flex-direction: column; gap: 10px; min-height: 420px; }
      .panel-head { align-items: center; border-bottom: 1px solid #ddd; display: flex; gap: 8px; justify-content: space-between; padding-bottom: 8px; }
      h2 { font-size: 12px; margin: 0; }
      .button { border: 1px solid #999; border-radius: 3px; font-size: 11px; padding: 4px 8px; }
      .stack {
        align-items: center;
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 4px;
        justify-content: center;
        padding: 24px 16px;
        text-align: center;
      }
      .mark { color: #777; font-size: 18px; margin-bottom: 4px; }
      .stack-title { font-size: 13px; font-weight: 600; margin: 0; }
      .stack-copy { color: #555; font-size: 12px; margin: 0; max-width: 360px; }
      @media (max-width: 768px) {
        body { padding: 12px; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="region" aria-label="Page header (outside the body)">
        <span class="note">region_page_header · external</span>
        <h1>Draft goals</h1>
        <span class="identity">owner/repo · idle · 0 draft(s)</span>
      </header>
      <main aria-label="Draft goals body">
        <section class="region panel" aria-labelledby="list-title">
          <span class="note">region_list · P0</span>
          <div class="panel-head">
            <h2 id="list-title">Proposed goals</h2>
            <span class="button">New goal</span>
          </div>
          <div class="stack" aria-label="region_empty">
            <span class="mark" aria-hidden="true">✎</span>
            <p class="stack-title">No drafts yet</p>
            <p class="stack-copy">
              Create one with New goal, or propose it from a report. Each draft becomes a goal you
              can elaborate here.
            </p>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
